worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format upstream escape=json
        '{"time":"$time_iso8601","method":"$request_method",'
        '"status":$status,"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status","request_time":$request_time,'
        '"correlation_id":"$http_x_correlation_id"}';
    access_log /dev/stdout upstream;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    upstream applications {
        zone applications 64k;
        server app-1:3000 resolve;
        server app-2:3000 resolve;
        server app-3:3000 resolve;
    }

    server {
        listen 80;
        client_max_body_size 1m;
        error_page 413 = @request_too_large;

        location @request_too_large {
            default_type application/json;
            return 413 '{"category":"ValidationError","code":"HTTP_REQUEST_TOO_LARGE","message":"The request body exceeds the size limit."}';
        }

        location / {
            proxy_pass http://applications;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors off;
            proxy_next_upstream off;
        }
    }
}
